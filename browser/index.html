<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astonia WASM/WebGPU Client</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <section class="topbar">
        <div>
          <p class="eyebrow">Native browser target</p>
          <h1 id="app-title">Astonia WASM/WebGPU Client</h1>
        </div>
        <form class="launch-bar" data-testid="wasm-launch-form">
          <label>
            <span>Gateway</span>
            <input name="gateway" autocomplete="off" spellcheck="false" />
          </label>
          <label>
            <span>Username</span>
            <input name="username" autocomplete="username" spellcheck="false" />
          </label>
          <label>
            <span>Password</span>
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <button type="submit">Launch</button>
        </form>
      </section>

      <section class="status-grid" aria-label="Target status">
        <article class="status-card" data-testid="webgpu-status" data-webgpu-state="checking">
          <span class="status-light" aria-hidden="true"></span>
          <div>
            <h2 data-webgpu-title>Checking WebGPU</h2>
            <p data-webgpu-detail>Preparing native browser target.</p>
          </div>
        </article>
        <article class="status-card" data-testid="wasm-module-status" data-module-state="checking">
          <span class="status-light" aria-hidden="true"></span>
          <div>
            <h2 data-module-title>Checking Native Module</h2>
            <p data-module-detail>Looking for the compiled WASM client.</p>
          </div>
        </article>
      </section>

      <section class="client-stage" aria-label="Native client">
        <canvas data-testid="wasm-client-canvas" id="canvas" width="1280" height="720"></canvas>
      </section>

      <section class="native-log" data-testid="native-log" aria-label="Native client log"></section>
    </main>
  </body>
</html>
